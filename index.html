<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GitHub Profile Finder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1 class="heading">🔍 GitHub Profile Finder</h1>

    <!-- Input section -->
    <div class="search-bar">
      <input id="username" type="text" placeholder="Enter GitHub username" class="input" />
      <button id="searchBtn" type="button" class="button">Search</button>
    </div>

    <!-- Result section -->
    <div id="profile" class="profile-card"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
